[project]
name = "odyssey-server"
version = "0.1.0"
description = "Odyssey healthcare management system API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "odyssey-database",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
odyssey-database = { path = "../database", editable = true }
