[project]
name = "odyssey-database"
version = "0.1.0"
description = "Database connection for the Odyssey server"
requires-python = ">=3.12"
dependencies = [
    "hjson>=3.1.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["db.py"]
